<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tracing Tools</title>
    <!-- <link rel="stylesheet" href="./style.css"> -->
</head>
<body class="p-3">
    <!-- <script type="module" src="index.js"></script> -->
    <div id="load_image">
        <label for="file_input">Load Background Image: </label>
        <input class="btn btn-primary" type="file" id="file_input" name="file_input" accept="image/*">
    </div>

    <div class="drawing_container p-2">
        <div class="konva_column" id="konvatest"></div>
        <div class="layers_column" id="groupsVis">Glyphs</div>
    </div>
    
    <div id="lineinfo"></div>

    <div id="grouping">
        <button id="groupbutton" hidden>Create Glyph</button>
        <input type="text" id="groupidinput" placeholder="Group ID" hidden>
        <button id="submitgroupid" hidden>Submit Glyph</button>
    </div>

    <!-- <button id="newrow">Create New Row</button> -->
   
    <div class="save_load_container">
        <div class="save_load_child p-2" id="file_load">
            <label for="jsonFileInput">Load Saved File: </label>
            <input type="file" id="jsonFileInput" name="jsonFileInput" accept=".geojson, .json, text/plain" />
        </div>
        
        <div class="save_load_child p-2" id="save_file">
            <label for="reportchildren">Save File: </label>
            <button id="reportchildren" name="reportchildren">Save</button>
        </div>
    </div>
    
    <div class="table table-dark table-striped" id="infotable" style="width: 100%""></div>
</body>
</html>
